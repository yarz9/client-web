name: Harden server

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/harden-server.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch server
        run: node scripts/harden-server.mjs
      - run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Commit
        run: |
          git config user.name "BioHerbica patch"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Harden the API: body caps, pool, proxy IP, tracking endpoint"
          git push
      - name: Clean up helper files
        if: success()
        run: |
          git rm -q scripts/harden-server.mjs .github/workflows/harden-server.yml
          git config user.name "BioHerbica patch"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Remove the one-off hardening helper"
          git push
