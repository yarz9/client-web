name: Fix order dialog

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/fix-order-dialog.mjs
      - run: npm run typecheck
      - run: npm run build
      - name: Commit
        run: |
          git config user.name "BioHerbica patch"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Checkout: dijalog potvrde iznad stranice potvrde"
          git push
