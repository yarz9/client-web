name: Admin panel patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/apply-admin-patch.mjs
      - run: npm run typecheck
      - run: npm run build
      - name: Commit patched sources
        run: |
          git config user.name "BioHerbica patch"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Admin: status narudzbi, brisanje otkazanih, kod pracenja i email"
          git push
