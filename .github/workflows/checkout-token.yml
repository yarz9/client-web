name: Checkout tracking token

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/checkout-token.yml'

permissions:
  contents: write

jobs:
  token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch checkout
        run: node scripts/checkout-token.mjs
      - run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Commit
        run: |
          git config user.name "BioHerbica patch"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Checkout: keep the tracking token, store no personal data"
          git push
      - name: Clean up helper files
        if: success()
        run: |
          git rm -q scripts/checkout-token.mjs .github/workflows/checkout-token.yml
          git config user.name "BioHerbica patch"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Remove the one-off checkout helper"
          git push
