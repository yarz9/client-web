name: Tracking token

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/track-token.yml'

permissions:
  contents: write

jobs:
  token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch tracking
        run: node scripts/track-token.mjs
      - run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Commit
        run: |
          git config user.name "BioHerbica patch"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Tracking: phone check returns a token, so a verified order syncs from now on"
          git push
      - name: Clean up helper files
        if: success()
        run: |
          git rm -q scripts/track-token.mjs .github/workflows/track-token.yml
          git config user.name "BioHerbica patch"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Remove the one-off tracking helper"
          git push
